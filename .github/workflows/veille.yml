# La veille : chaque matin, GitHub lance l'extraction France Travail sur ses machines,
# met à jour data/ et le résumé de la page, et enregistre le tout par un commit.
# Les identifiants sont dans Settings -> Secrets and variables -> Actions (FT_CLIENT_ID, FT_CLIENT_SECRET,
# et ADZUNA_APP_ID, ADZUNA_APP_KEY pour Adzuna, facultatifs).
name: veille

on:
  schedule:
    - cron: "0 5 * * *"       # 5 h UTC = 7 h à Paris en été (6 h en hiver) ; GitHub ne connaît que l'UTC
  workflow_dispatch:          # et le bouton « Run workflow » pour lancer à la main

permissions:
  contents: write             # le workflow doit pouvoir pousser son commit

jobs:
  extraire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Extraire les offres et refaire le résumé
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: |
          python scripts/extraire.py
          python scripts/resumer.py

      # Adzuna : seconde source, gardée à part dans data/adzuna/ (voir guide-adzuna.md).
      # Sans les secrets ADZUNA_APP_ID / ADZUNA_APP_KEY, le script ne fait rien ;
      # s'il échoue (quota, panne), la veille France Travail est quand même enregistrée.
      - name: Extraire les offres Adzuna
        continue-on-error: true
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/extraire_adzuna.py

      - name: Enregistrer la donnée du jour (commit + push)
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@github.com"
          git add data
          git commit -m "veille : offres du $(date -u +%Y-%m-%d)" || echo "rien de nouveau"
          git push
